<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Review your Café Calle Ocho order before placing it.">
  <title>Your Order | Café Calle Ocho</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    :root {
      --pico-font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
      --pico-border-radius: 1rem;
      --pico-color: #171717;
      --pico-primary: #171717;
    }

    body { padding: 1.5rem 1rem; }
    .cafe-app {
      max-width: 1140px;
      margin: 0 auto;
      border: 2px solid #171717;
      border-radius: 2rem;
      overflow: hidden;
    }
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      padding: 1.25rem 2rem;
      border-bottom: 2px solid #171717;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: .85rem;
      color: inherit;
      text-decoration: none;
      white-space: nowrap;
    }
    .brand-icon { font-size: 2.5rem; line-height: 1; }
    .brand-name { font-size: 1.35rem; font-weight: 700; }
    .main-nav { display: flex; flex-wrap: wrap; gap: .65rem; }
    .main-nav a, .outline-link, .primary-link, .quantity-control button, .remove-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.65rem;
      padding: .5rem 1rem;
      border: 2px solid #171717;
      border-radius: .8rem;
      color: #171717;
      background-color: #fff;
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 2px 0 #171717;
    }
    .main-nav a[aria-current="page"], .primary-link, .order-total {
      background-image: repeating-linear-gradient(135deg, #fff 0, #fff 5px, #e8e8e8 5px, #e8e8e8 7px);
    }
    main { padding: 1.5rem 1.75rem 2rem; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 2.8rem); }
    .intro { margin: .25rem 0 1.5rem; }
    .order-table-wrap {
      overflow-x: auto;
      border: 2px solid #171717;
      border-radius: 1.2rem;
      box-shadow: 0 2px 0 #171717;
    }
    .order-table {
      width: 100%;
      min-width: 700px;
      margin: 0;
      border-collapse: collapse;
    }
    .order-table th, .order-table td {
      padding: .8rem .75rem;
      vertical-align: middle;
      border-bottom: 2px solid #171717;
    }
    .order-table thead th { font-size: 1.1rem; }
    .order-table tbody tr:last-child td { border-bottom: 0; }
    .order-table th:first-child, .order-table td:first-child { padding-left: 1.25rem; }
    .item-name { display: flex; align-items: center; gap: .85rem; font-weight: 700; }
    .item-icon {
      display: grid;
      place-items: center;
      width: 4rem;
      min-height: 3.5rem;
      flex: 0 0 4rem;
      border-right: 2px solid #171717;
      font-size: 2rem;
    }
    .money { font-weight: 700; white-space: nowrap; }
    .quantity-control { display: inline-flex; align-items: center; border: 2px solid #171717; border-radius: .8rem; overflow: hidden; }
    .quantity-control button {
      min-height: 2.4rem;
      padding: .25rem .55rem;
      margin: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      font-size: 1.2rem;
    }
    .quantity-control button:disabled { opacity: .45; cursor: not-allowed; }
    .quantity-control output { min-width: 2.4rem; text-align: center; font-weight: 700; }
    .remove-button { min-width: 2.6rem; min-height: 2.6rem; padding: .25rem; margin: 0; font-size: 1.2rem; }
    .empty-order { padding: 1.5rem !important; text-align: center; }
    .order-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: min(100%, 440px);
      margin: 1.5rem 0 2rem auto;
      padding: .75rem 1.25rem;
      border: 2px solid #171717;
      border-radius: 1rem;
      box-shadow: 0 2px 0 #171717;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .order-total strong { font-size: 1.7rem; }
    .page-actions { display: flex; justify-content: space-between; gap: 1rem; }
    .outline-link, .primary-link { min-height: 3.25rem; padding: .65rem 1.5rem; font-size: 1.15rem; }
    .primary-link { min-width: min(42%, 340px); }
    .primary-link[aria-disabled="true"] { opacity: .55; pointer-events: none; }

    @media (max-width: 760px) {
      body { padding: .75rem; }
      .cafe-app { border-radius: 1.25rem; }
      .site-header { align-items: flex-start; flex-direction: column; padding: 1rem; }
      .main-nav { width: 100%; }
      .main-nav a { flex: 1 1 auto; padding-inline: .65rem; }
      main { padding: 1.25rem 1rem 1.5rem; }
    }
    @media (max-width: 500px) {
      .page-actions { align-items: stretch; flex-direction: column; }
      .page-actions a { width: 100%; }
      .order-total { margin-top: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="cafe-app">
    <header class="site-header">
      <a class="brand" href="menu.html" aria-label="Café Calle Ocho menu">
        <span class="brand-icon" aria-hidden="true">☕</span>
        <span class="brand-name">Café Calle Ocho</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="menu.html">Menu</a>
        <a href="order.html" aria-current="page">My Order</a>
        <a href="history.html">Track Order</a>
        <a href="kitchen.html">Kitchen</a>
      </nav>
    </header>

    <main>
      <h1>Your Order</h1>
      <p class="intro">Review your items before placing the order.</p>

      <div class="order-table-wrap">
        <table class="order-table">
          <thead>
            <tr>
              <th scope="col">Item</th>
              <th scope="col">Price</th>
              <th scope="col">Qty</th>
              <th scope="col">Total</th>
              <th scope="col"><span class="visually-hidden">Remove item</span></th>
            </tr>
          </thead>
          <tbody>
            <tr data-price="3.50">
              <td>
                <div class="item-name"><span class="item-icon" aria-hidden="true">☕</span><span>Café con Leche</span></div>
              </td>
              <td class="money">$3.50</td>
              <td>
                <div class="quantity-control">
                  <button type="button" class="decrease-quantity" aria-label="Decrease Café con Leche quantity">−</button>
                  <output aria-live="polite">1</output>
                  <button type="button" class="increase-quantity" aria-label="Increase Café con Leche quantity">+</button>
                </div>
              </td>
              <td class="money line-total">$3.50</td>
              <td><button class="remove-button" type="button" aria-label="Remove Café con Leche">♧</button></td>
            </tr>
            <tr data-price="8.50">
              <td>
                <div class="item-name"><span class="item-icon" aria-hidden="true">🥪</span><span>Cuban Sandwich</span></div>
              </td>
              <td class="money">$8.50</td>
              <td>
                <div class="quantity-control">
                  <button type="button" class="decrease-quantity" aria-label="Decrease Cuban Sandwich quantity">−</button>
                  <output aria-live="polite">1</output>
                  <button type="button" class="increase-quantity" aria-label="Increase Cuban Sandwich quantity">+</button>
                </div>
              </td>
              <td class="money line-total">$8.50</td>
              <td><button class="remove-button" type="button" aria-label="Remove Cuban Sandwich">♧</button></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="order-total" aria-live="polite"><span>Order Total:</span><strong>$12.00</strong></div>

      <div class="page-actions">
        <a class="outline-link" href="menu.html"><span aria-hidden="true">←</span>&nbsp; Back to Menu</a>
        <a class="primary-link" href="confirmation.html">Place Order <span aria-hidden="true">✓</span></a>
      </div>
    </main>
  </div>
  <script>
    const orderBody = document.querySelector('.order-table tbody');
    const orderTotal = document.querySelector('.order-total strong');
    const placeOrderLink = document.querySelector('.primary-link');

    function updateOrder() {
      const rows = [...orderBody.querySelectorAll('tr[data-price]')];
      let total = 0;

      rows.forEach((row) => {
        const quantityOutput = row.querySelector('output');
        const quantity = Number(quantityOutput.value || quantityOutput.textContent);
        const price = Number(row.dataset.price);
        row.querySelector('.line-total').textContent = `$${(price * quantity).toFixed(2)}`;
        row.querySelector('.decrease-quantity').disabled = quantity <= 1;
        total += price * quantity;
      });

      if (rows.length === 0) {
        if (!orderBody.querySelector('.empty-order')) {
          const emptyRow = document.createElement('tr');
          emptyRow.innerHTML = '<td class="empty-order" colspan="5">Your order is empty. Add items from the menu.</td>';
          orderBody.append(emptyRow);
        }
        placeOrderLink.setAttribute('aria-disabled', 'true');
        placeOrderLink.setAttribute('tabindex', '-1');
      } else {
        orderBody.querySelector('.empty-order')?.closest('tr')?.remove();
        placeOrderLink.removeAttribute('aria-disabled');
        placeOrderLink.removeAttribute('tabindex');
      }

      orderTotal.textContent = `$${total.toFixed(2)}`;
    }

    orderBody.addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;

      const row = button.closest('tr[data-price]');
      if (!row) return;

      const quantityOutput = row.querySelector('output');
      const quantity = Number(quantityOutput.textContent);

      if (button.classList.contains('increase-quantity')) {
        quantityOutput.textContent = quantity + 1;
      } else if (button.classList.contains('decrease-quantity')) {
        if (quantity > 1) quantityOutput.textContent = quantity - 1;
      } else if (button.classList.contains('remove-button')) {
        row.remove();
      }

      updateOrder();
    });

    updateOrder();
  </script>
</body>
</html>
